[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant-agent"
version = "0.1.7"
description = "Local course-watching and note-taking agent for Study Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=1.1,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "numpy>=2.1,<3",
  "onnxruntime>=1.22,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
build = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
study-assistant-agent = "study_assistant_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/agent"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
